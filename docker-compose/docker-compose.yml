networks:
  labotron_network:
    name: labotron_network
    external: true   # created by docker-compose.infra.yml

services:

  labotron-service:
    container_name: labotron-service
    image: ${LABOTRON_SERVICE_IMAGE}
    networks:
      - labotron_network
    ports:
      - "${LABOTRON_SERVICE_PORT}:8080"
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
      - "10003:10003"
      - "10004:10004"
      - "10005:10005"
      - "10006:10006"
      - "10007:10007"
      - "10008:10008"
      - "10009:10009"
      - "10010:10010"
      - "10011:10011"
      - "10012:10012"
      - "10013:10013"
      - "10014:10014"
      - "10015:10015"
      - "10016:10016"
      - "10017:10017"
      - "10018:10018"
      - "10019:10019"
      - "10020:10020"
      - "10021:10021"
      - "6800:6800"
      - "6000:6000"
      - "6900:6900"
      - "6901:6901"
      - "6100:6100"
      - "6500:6500"
      - "6600:6600"
      - "1182:1182"
      - "1183:1183"
    environment:
      - JAVA_OPTS=-Xmx4092m -Xms256m
      - DATASOURCE_URL
      - DATASOURCE_USERNAME
      - DATASOURCE_PASSWORD
      - DATASOURCE_DRIVERS
      - RABBITMQ_HOST
      - RABBITMQ_PORT=5672
      - RABBITMQ_USERNAME
      - RABBITMQ_PASSWORD
      - CORS_ALLOWED_ORIGIN
      - TZ=Asia/Beirut
    restart: unless-stopped
    volumes:
      - ./logs:/usr/local/tomcat/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  labotron-web:
    container_name: labotron-web
    image: ${LABOTRON_WEB_IMAGE}
    networks:
      - labotron_network
    ports:
      - "${LABOTRON_WEB_PORT}:80"
    environment:
      - API_URL
    restart: always

  prometheus:
    container_name: labotron-prometheus
    image: prom/prometheus:v2.53.3
    networks:
      - labotron_network
    restart: unless-stopped
    ports:
      - "${PROMETHEUS_PORT}:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    depends_on:
      - labotron-service

  loki:
    container_name: labotron-loki
    image: grafana/loki:3.0.0
    networks:
      - labotron_network
    restart: unless-stopped
    ports:
      - "${LOKI_PORT}:3100"
    volumes:
      - ./monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml

  promtail:
    container_name: labotron-promtail
    image: grafana/promtail:3.0.0
    networks:
      - labotron_network
    restart: unless-stopped
    volumes:
      - ./monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki

  grafana:
    container_name: labotron-grafana
    image: grafana/grafana:11.0.0
    networks:
      - labotron_network
    restart: unless-stopped
    ports:
      - "${GRAFANA_PORT}:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - loki

volumes:
  prometheus_data:
    name: labotron_prometheus_data
    driver: local
  loki_data:
    name: labotron_loki_data
    driver: local
  grafana_data:
    name: labotron_grafana_data
    driver: local
